name: Executor and offline demo checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-dev.txt -c requirements-tested.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python tools/replay_example.py --out replay-output
        env:
          OPENBLAS_NUM_THREADS: '4'
      - run: python tools/validate_demo.py
      - run: python tools/replay_dataset.py --scope full --dry-run
